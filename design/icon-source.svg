<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bgClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#FFFFFF"/>

  <g clip-path="url(#bgClip)">
    <!-- Coins scattered around the wallet base (drawn first so the wallet overlaps/tucks the innermost ones) -->
    <g>
      <!-- ===== left pile ===== -->
      <!-- near-perfect stack -->
      <circle cx="55" cy="478" r="30" fill="#E8C877" stroke="#127A3F" stroke-width="7"/>
      <circle cx="55" cy="478" r="16" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>
      <circle cx="62" cy="469" r="30" fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
      <circle cx="62" cy="469" r="16" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>
      <circle cx="69" cy="460" r="30" fill="#D3A94D" stroke="#127A3F" stroke-width="7"/>
      <circle cx="69" cy="460" r="16" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>

      <!-- small stack pair, further out -->
      <circle cx="-25" cy="450" r="22" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>
      <circle cx="-19" cy="443" r="22" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <!-- loose scatter, wide spread, some tucked under the wallet's lower edge -->
      <circle cx="8" cy="405" r="27" fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
      <circle cx="8" cy="405" r="14" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>

      <circle cx="118" cy="435" r="24" fill="#E8C877" stroke="#127A3F" stroke-width="6"/>

      <circle cx="150" cy="405" r="19" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="100" cy="518" r="19" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <circle cx="20" cy="490" r="15" fill="#E8C877" stroke="#127A3F" stroke-width="5"/>

      <circle cx="-40" cy="490" r="16" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <circle cx="80" cy="515" r="21" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="133" cy="470" r="14" fill="#D3A94D" stroke="#127A3F" stroke-width="5"/>

      <circle cx="-5" cy="475" r="12" fill="#E8C877" stroke="#127A3F" stroke-width="5"/>

      <circle cx="170" cy="440" r="12" fill="#FFFFFF" stroke="#127A3F" stroke-width="5"/>

      <circle cx="35" cy="518" r="13" fill="#D3A94D" stroke="#127A3F" stroke-width="5"/>

      <!-- ===== center-bottom fill, between the two piles ===== -->
      <circle cx="248" cy="408" r="17" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <circle cx="300" cy="414" r="15" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="198" cy="446" r="21" fill="#E8C877" stroke="#127A3F" stroke-width="6"/>

      <circle cx="232" cy="466" r="16" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="272" cy="452" r="23" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <circle cx="260" cy="480" r="13" fill="#FFFFFF" stroke="#127A3F" stroke-width="5"/>

      <circle cx="315" cy="443" r="18" fill="#E8C877" stroke="#127A3F" stroke-width="6"/>

      <circle cx="335" cy="468" r="15" fill="#D3A94D" stroke="#127A3F" stroke-width="5"/>

      <circle cx="178" cy="475" r="12" fill="#FFFFFF" stroke="#127A3F" stroke-width="5"/>

      <circle cx="215" cy="490" r="11" fill="#E8C877" stroke="#127A3F" stroke-width="5"/>

      <!-- ===== right pile ===== -->
      <!-- near-perfect stack -->
      <circle cx="457" cy="479" r="28" fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
      <circle cx="457" cy="479" r="15" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>
      <circle cx="450" cy="469" r="28" fill="#E8C877" stroke="#127A3F" stroke-width="7"/>
      <circle cx="450" cy="469" r="15" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>
      <circle cx="443" cy="459" r="28" fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
      <circle cx="443" cy="459" r="15" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>

      <!-- small stack pair, further out -->
      <circle cx="537" cy="448" r="21" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>
      <circle cx="531" cy="441" r="21" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="512" cy="404" r="26" fill="#D3A94D" stroke="#127A3F" stroke-width="7"/>
      <circle cx="512" cy="404" r="13" fill="none" stroke="#127A3F" stroke-width="3" opacity="0.5"/>

      <!-- loose scatter, wide spread, some tucked under the wallet's lower edge -->
      <circle cx="392" cy="437" r="23" fill="#FFFFFF" stroke="#127A3F" stroke-width="6"/>

      <circle cx="362" cy="406" r="18" fill="#E8C877" stroke="#127A3F" stroke-width="6"/>

      <circle cx="416" cy="519" r="19" fill="#D3A94D" stroke="#127A3F" stroke-width="6"/>

      <circle cx="493" cy="482" r="16" fill="#FFFFFF" stroke="#127A3F" stroke-width="5"/>

      <circle cx="480" cy="518" r="21" fill="#E8C877" stroke="#127A3F" stroke-width="6"/>

      <circle cx="386" cy="472" r="13" fill="#D3A94D" stroke="#127A3F" stroke-width="5"/>

      <circle cx="345" cy="440" r="13" fill="#FFFFFF" stroke="#127A3F" stroke-width="5"/>

      <circle cx="500" cy="518" r="13" fill="#D3A94D" stroke="#127A3F" stroke-width="5"/>

      <circle cx="518" cy="470" r="12" fill="#E8C877" stroke="#127A3F" stroke-width="5"/>
    </g>

    <!-- Cards peeking behind wallet -->
    <g>
      <!-- back card -->
      <g transform="rotate(-9 272 145)">
        <rect x="178" y="86" width="188" height="118" rx="10"
              fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
        <rect x="178" y="112" width="188" height="20" fill="#2B2E33"/>
      </g>
      <!-- front card -->
      <g transform="rotate(6 244 157)">
        <rect x="150" y="98" width="188" height="118" rx="10"
              fill="#FFFFFF" stroke="#127A3F" stroke-width="7"/>
        <rect x="150" y="124" width="188" height="20" fill="#2B2E33"/>
        <rect x="165" y="152" width="30" height="22" rx="4" fill="#D3A94D"/>
      </g>
    </g>

    <!-- Wallet body -->
    <g>
      <rect x="96" y="176" width="320" height="248" rx="26" fill="#127A3F"/>
      <!-- wallet fold line -->
      <path d="M96 226 H416" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <!-- wallet flap / clasp -->
      <rect x="374" y="248" width="46" height="70" rx="12" fill="#FFFFFF"/>
      <circle cx="397" cy="283" r="7" fill="#127A3F"/>
      <!-- stitching -->
      <rect x="112" y="192" width="288" height="216" rx="18"
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.55"/>
    </g>

    <!-- Shield -->
    <g transform="translate(256 396) scale(0.85) translate(-256 -396)">
      <path d="M256 150
               L344 182
               V276
               C344 336 306 372 256 396
               C206 372 168 336 168 276
               V182
               Z"
            fill="#FFFFFF" stroke="#127A3F" stroke-width="12" stroke-linejoin="round"/>

      <!-- Growth arrow through shield -->
      <path d="M196 298 L228 254 L254 276 L312 202"
            fill="none" stroke="#127A3F" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M280 196 L316 200 L312 236"
            fill="none" stroke="#127A3F" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Lock -->
      <g transform="translate(256 338)">
        <rect x="-32" y="-4" width="64" height="48" rx="11" fill="#127A3F"/>
        <path d="M-19 -4 V-21 A19 19 0 0 1 19 -21 V-4"
              fill="none" stroke="#127A3F" stroke-width="13"/>
        <circle cx="0" cy="19" r="7.5" fill="#FFFFFF"/>
        <rect x="-4" y="19" width="8" height="15" rx="3" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
